global:
  scrape_interval: 15s

scrape_configs:
          
  - job_name: "docker-containers"
    static_configs:
      - targets:
          - "cadvisor:8080"

  - job_name: "spark-master"
    metrics_path: "/metrics/master/prometheus"
    static_configs:
      - targets:
          - "namenode:8080"

  - job_name: "spark-worker"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets:
          - "namenode:8081"

  - job_name: "spark-driver"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets:
          - "namenode:4040"